<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دار التألق للعطور</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#faf7f2;color:#241c18}
header{background:linear-gradient(135deg,#211711,#5a3825);color:#fff;padding:34px 18px 28px;text-align:center}
.logo{font-size:34px;font-weight:800;letter-spacing:.5px}.sub{opacity:.85;margin-top:7px}
.wrap{max-width:1100px;margin:auto;padding:18px}
.searchbox{margin:-12px auto 22px;max-width:820px;background:white;padding:18px;border-radius:20px;box-shadow:0 8px 30px #0001}
.searchbox h2{margin:0 0 10px;font-size:23px}.search{width:100%;padding:15px 18px;border:1px solid #ddd;border-radius:14px;font-size:17px;outline:none}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tag{border:1px solid #d7c5b7;background:#fff8f2;padding:8px 12px;border-radius:30px;cursor:pointer}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.controls button{border:0;padding:10px 14px;border-radius:12px;background:#3b291e;color:#fff;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:16px}
.card{background:#fff;border:1px solid #eadfd6;border-radius:20px;overflow:hidden;box-shadow:0 5px 18px #0000000b;display:flex;flex-direction:column}
.visual{min-height:205px;background:linear-gradient(135deg,#f4eadf,#fff);display:flex;align-items:center;justify-content:center;gap:12px;padding:15px}
.bottle-photo{width:145px;height:175px;object-fit:contain;filter:drop-shadow(0 10px 13px #0002);border-radius:12px}
.fallback-bottle{width:120px;height:165px;border-radius:22px 22px 30px 30px;background:linear-gradient(90deg,#5b3a29,#d3a77f,#6e4b35);display:flex;align-items:center;justify-content:center;text-align:center;color:white;font-weight:800;padding:12px;box-shadow:0 10px 20px #0002;position:relative}
.fallback-bottle:before{content:"";position:absolute;width:48px;height:20px;background:#252525;top:-16px;left:36px;border-radius:6px 6px 2px 2px}
.notesimg{width:125px;min-height:125px;border-radius:50%;background:#fff;border:1px solid #ddd;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;padding:12px;box-shadow:0 4px 12px #0000000a}
.note-mini{display:flex;flex-direction:column;align-items:center;justify-content:center;width:47px;min-height:48px;font-size:20px}
.note-mini span{font-size:8px;color:#66574f;line-height:1.2;text-align:center;max-width:47px}
.body{padding:15px}.brand{font-size:12px;color:#8a6752}.name{font-size:19px;font-weight:800;margin:3px 0 7px}.desc{font-size:13px;line-height:1.7;color:#594b44}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}.chip{font-size:11px;background:#f3ece6;padding:5px 8px;border-radius:20px}
.price{font-weight:800;margin-top:auto;padding-top:8px}.price span{font-size:12px;color:#806d61;font-weight:normal}
footer{text-align:center;padding:35px 10px;color:#79685d}.empty{text-align:center;padding:35px;display:none}
.admin{background:#fff;border:1px dashed #c9b6a8;border-radius:18px;padding:15px;margin-top:22px}.admin code{background:#f2ece7;padding:3px 6px;border-radius:5px}
.image-status{font-size:10px;color:#9a877b;text-align:center;margin-top:4px}
@media(max-width:520px){
  .logo{font-size:28px}.grid{grid-template-columns:1fr}
  .visual{min-height:195px}.bottle-photo{width:135px;height:165px}.notesimg{width:115px;min-height:115px}
}
</style>
</head>
<body>
<header><div class="logo">دار التألق للعطور</div><div class="sub">اكتشف عطرك… قبل ما تشمّه ✨</div></header>
<main class="wrap">
<section class="searchbox">
<h2>واش حاب تشم؟ 🔍</h2>
<input id="q" class="search" placeholder="مثلاً: فانيلا، أناناس، ليمون، ورد، عود، منعش، حلو...">
<div class="tags">
<button class="tag" onclick="pick('فانيلا')">🍦 فانيلا</button><button class="tag" onclick="pick('أناناس')">🍍 فواكه</button>
<button class="tag" onclick="pick('ورد')">🌹 ورد</button><button class="tag" onclick="pick('عود')">🪵 عود</button>
<button class="tag" onclick="pick('مسك')">🤍 مسك</button><button class="tag" onclick="pick('حمضيات')">🍊 منعش</button>
<button class="tag" onclick="pick('شوكولاتة')">🍫 حلو</button><button class="tag" onclick="pick('عنبر')">🌙 شرقي</button>
</div>
<div class="controls"><button onclick="showAll()">كل العطور</button><button onclick="recommend()">✨ اقترحلي</button></div>
</section>
<div id="resultInfo"></div>
<section id="grid" class="grid"></section>
<div id="empty" class="empty">ما لقيناش عطر مطابق. جرّب كلمة أخرى مثل فانيلا، ورد، عود، فواكه أو مسك.</div>
<section class="admin"><b>إدارة الموقع:</b> كل عطر عنده الآن خانة صورة مستقلة داخل مجلد <code>images/</code>، والنوتات تظهر بصرياً بدل الزهرة.</section>
</main>
<footer>دار التألق للعطور · جودة الرائحة تبدأ من الاختيار الصحيح</footer>

<script>
let perfumes=[];

const noteIcons={
  'vanille':'🍦','فانيلا':'🍦','ananas':'🍍','أناناس':'🍍',
  'rose':'🌹','ورد':'🌹','oud':'🪵','عود':'🪵',
  'musc':'🤍','مسك':'🤍','musc blanc':'🤍','مسك أبيض':'🤍',
  'agrumes':'🍊','حمضيات':'🍊','citron':'🍋','ليمون':'🍋',
  'orange':'🍊','orange sanguine':'🍊','bergamote':'🍋',
  'pamplemousse':'🍊','fraise':'🍓','framboise':'🫐',
  'pomme':'🍎','pomme verte':'🍏','poire':'🍐','pêche':'🍑',
  'caramel':'🍯','chocolat':'🍫','chocolat':'🍫','cacao':'🍫',
  'miel':'🍯','عسل':'🍯','lait':'🥛','حليب':'🥛',
  'tabac':'🍂','tonka':'🌰','noisette':'🌰','châtaigne':'🌰',
  'ambre':'🧡','عنبر':'🧡','épices':'🌶️','épice':'🌶️',
  'gingembre':'🫚','cardamome':'🌿','cannelle':'🪵',
  'lavande':'💜','jasmin':'🌼','fleur de lotus':'🪷',
  'violette':'💜','thé noir':'🍵','thé':'🍵','café':'☕',
  'menthe':'🌿','basilic':'🌿','safran':'🌼','encens':'🕯️',
  'bois':'🪵','boisé':'🪵','cèdre':'🌲','vétiver':'🌿',
  'cuir':'👜','fruits':'🍇','fruits rouges':'🍓','floral':'🌸',
  'mimosa':'🌼','minéral':'💎','notes marines':'🌊','frais':'❄️',
  'poudré':'☁️','gourmand':'🍬','marshmallow':'☁️'
};

const searchAliases={
 'ليمون':['ليمون','حمضيات','منعش','موالح','برتقال','برغموت','citron','agrumes','bergamote'],
 'حامض':['ليمون','حمضيات','موالح','برغموت'],
 'منعش':['منعش','حمضيات','ليمون','برتقال','نعناع','مائي','فريش','فواكه','frais','agrumes'],
 'فريش':['منعش','حمضيات','ليمون','مائي','فواكه','frais'],
 'فاكهة':['فواكه','أناناس','تفاح','كمثرى','خوخ','ماندارين','حمضيات','fruité'],
 'فواكه':['فواكه','أناناس','تفاح','كمثرى','خوخ','ماندارين','حمضيات','fruité'],
 'أناناس':['أناناس','فواكه','حمضيات','ananas','fruité'],
 'حلو':['حلو','فانيلا','كراميل','شوكولاتة','حليب','سكر','عسل','تونكا','sucré','gourmand'],
 'شوكولا':['شوكولاتة','كاكاو','حلو','كراميل','chocolat','cacao'],
 'شرقي':['شرقي','عود','عنبر','تبغ','توابل','oriental','ambre','oud'],
 'شتاء':['دافئ','عنبر','فانيلا','عود','تبغ','warm','chaud'],
 'صيف':['منعش','حمضيات','فواكه','مائي','marin','frais']
};

function normalize(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');
}
function expandQuery(q){
  q=normalize(q.trim());
  if(!q) return [];
  return [q,...(searchAliases[q]||[]).map(normalize)];
}
function search(q){
  const terms=expandQuery(q);
  if(!terms.length)return perfumes;
  return perfumes.filter(p=>{
    const hay=normalize([p.name,p.brand,p.description,(p.notes||[]).join(' '),(p.keywords||[]).join(' ')].join(' '));
    return terms.some(t=>hay.includes(t));
  });
}
function pick(x){document.getElementById('q').value=x;render(search(x))}
function showAll(){document.getElementById('q').value='';document.getElementById('resultInfo').innerHTML='';render(perfumes)}
function recommend(){
  const q=document.getElementById('q').value;
  const arr=search(q).slice(0,8);
  document.getElementById('resultInfo').innerHTML=q
    ? `<p><b>اقتراحاتنا لـ «${escapeHtml(q)}»:</b> اختر من العطور التالية حسب ذوقك.</p>`
    : '<p><b>✨ اقتراحات مميزة:</b> جرّب الأكثر طلباً أو ابحث حسب النوتة.</p>';
  render(arr);
}
document.getElementById('q').addEventListener('input',e=>render(search(e.target.value)));

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function noteIcon(note){
  const n=normalize(note);
  return noteIcons[n] || Object.entries(noteIcons).find(([k])=>n.includes(normalize(k)))?.[1] || '✨';
}
function noteVisual(notes){
  return (notes||[]).slice(0,4).map(n=>
    `<div class="note-mini"><div>${noteIcon(n)}</div><span>${escapeHtml(n)}</span></div>`
  ).join('');
}
function fallbackBottle(p){
  const initials=escapeHtml((p.name||'').split(/\\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase());
  return `<div class="fallback-bottle">${initials}<br><small>صورة العطر</small></div>`;
}
function imageBox(p){
  const local=escapeHtml(p.image||'');
  const search=encodeURIComponent(p.imageSearch||((p.name||'')+' '+(p.brand||'')+' perfume bottle'));
  return `<div class="photo-wrap" data-search="${search}">
    <img class="bottle-photo" src="${local}" alt="${escapeHtml(p.name)}" loading="lazy"
      onerror="smartImage(this,'${search}')">
    <div class="image-fallback" style="display:none">${fallbackBottle(p)}</div>
  </div>`;
}
function smartImage(img, search){
  // الصور المحلية في مجلد images/ هي المصدر الأساسي.
  // إذا فشلت صورة، نعرض بطاقة القارورة التعريفية بدل رمز الصورة المكسورة.
  img.style.display='none';
  if(img.nextElementSibling) img.nextElementSibling.style.display='flex';
}
function render(arr){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  document.getElementById('empty').style.display=arr.length?'none':'block';
  arr.forEach(p=>{
    const card=document.createElement('article');
    card.className='card';
    card.innerHTML=`
      <div class="visual">
        ${imageBox(p)}
        <div class="notesimg">${noteVisual(p.notes)}</div>
      </div>
      <div class="body">
        <div class="brand">${escapeHtml(p.brand||'')}</div>
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="desc">${escapeHtml(p.description||'')}</div>
        <div class="chips">${(p.notes||[]).map(n=>`<span class="chip">${noteIcon(n)} ${escapeHtml(n)}</span>`).join('')}</div>
        <div class="price">ابتداءً من ${p.prices?.['2ml']??200} دج <span>· حسب العبوة حتى ${p.prices?.['30ml']??1000} دج</span></div>
      </div>`;
    grid.appendChild(card);
  });
}
init();
async function init(){
  try{
    perfumes=await (await fetch('perfumes.json')).json();
    render(perfumes);
  }catch(e){
    document.getElementById('empty').style.display='block';
    document.getElementById('empty').textContent='تعذر تحميل قائمة العطور. تأكد أن perfumes.json موجود بجانب index.html.';
  }
}
</script>
</body>
</html>
